<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TiPToe | Sports News Digest</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #1a6fd4;
      --brand-dark: #1258ac;
      --bg: #0f1b2d;
      --surface: #162236;
      --surface2: #1e2f47;
      --border: #2a3f5f;
      --text: #e8edf5;
      --text-muted: #8ba3c0;
      --accent: #4fa3f7;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    .logo span {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 1rem;
      margin-left: 0.6rem;
    }

    .settings-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: border-color 0.2s, color 0.2s;
    }

    .settings-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Main layout ── */
    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── News Panel ── */
    #news-panel {
      width: 50%;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 1rem 1.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    #filter-bar {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #filter-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      color: var(--text);
      font-size: 0.825rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    #filter-input:focus { outline: none; border-color: var(--accent); }
    #filter-input::placeholder { color: var(--text-muted); }

    #filter-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.45rem 0.875rem;
      font-size: 0.825rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      white-space: nowrap;
    }

    #filter-btn:hover { border-color: var(--accent); color: var(--accent); }

    #clear-filter-btn {
      background: none;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-muted);
      padding: 0.45rem 0.5rem;
      font-size: 0.825rem;
      cursor: pointer;
      transition: color 0.2s;
      display: none;
    }

    #clear-filter-btn:hover { color: var(--text); }

    .filter-tag {
      font-size: 0.7rem;
      background: var(--brand);
      color: #fff;
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      margin-left: 0.5rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      vertical-align: middle;
    }

    #articles-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
    }

    #articles-container::-webkit-scrollbar { width: 6px; }
    #articles-container::-webkit-scrollbar-track { background: transparent; }
    #articles-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .article-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.125rem;
      transition: border-color 0.2s;
    }

    .article-card:hover { border-color: var(--accent); }

    .article-section {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }

    .article-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .article-abstract {
      font-size: 0.825rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 0.625rem;
    }

    .article-link {
      font-size: 0.775rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .article-link:hover { text-decoration: underline; }

    /* Loading / error states */
    .state-msg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--text-muted);
      gap: 0.75rem;
      font-size: 0.9rem;
      text-align: center;
      padding: 2rem;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Summary Panel ── */
    #summary-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #summary-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1.5rem;
    }

    #summary-content::-webkit-scrollbar { width: 6px; }
    #summary-content::-webkit-scrollbar-track { background: transparent; }
    #summary-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .summary-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      gap: 0.75rem;
      font-size: 0.875rem;
    }

    .summary-placeholder .icon { font-size: 2rem; }

    .summary-source {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .summary-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 1rem;
    }

    .summary-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1rem 0;
    }

    .summary-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }

    .summary-body {
      font-size: 0.9rem;
      line-height: 1.7;
      color: var(--text);
    }

    .summary-footer { margin-top: 1.25rem; }

    /* Summarize button on cards */
    .summarize-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .summarize-btn:hover { background: var(--surface2); border-color: var(--accent); }

    /* ── Settings Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-overlay.hidden { display: none; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      width: 440px;
      max-width: 90vw;
    }

    .modal h2 {
      font-size: 1.1rem;
      margin-bottom: 0.35rem;
    }

    .modal p {
      color: var(--text-muted);
      font-size: 0.825rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .field input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.875rem;
      color: var(--text);
      font-size: 0.875rem;
      font-family: monospace;
      transition: border-color 0.2s;
    }

    .field input:focus { outline: none; border-color: var(--accent); }

    .modal-actions {
      display: flex;
      gap: 0.625rem;
      margin-top: 1.5rem;
    }

    .btn-primary {
      flex: 1;
      background: var(--brand);
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 0.65rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover { background: var(--brand-dark); }

    .btn-secondary {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      padding: 0.65rem 1rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .btn-secondary:hover { border-color: var(--text-muted); }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      #articles-container { padding: 0.75rem 1rem; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">TiPToe <span>Sports News Digest</span></div>
    <button class="settings-btn" id="settings-btn">⚙ API Keys</button>
  </header>

  <!-- Main -->
  <main>
    <!-- Left: News -->
    <section id="news-panel">
      <div class="panel-header">Today's Top Stories <span id="filter-tag" class="filter-tag" style="display:none"></span></div>
      <div id="filter-bar">
        <input type="text" id="filter-input" placeholder="Filter: e.g. US sports, basketball, NBA…">
        <button id="filter-btn">Apply</button>
        <button id="clear-filter-btn" title="Clear filter">✕</button>
      </div>
      <div id="articles-container">
        <div class="state-msg" id="news-state">
          <div class="spinner"></div>
          <span>Loading sports news…</span>
        </div>
      </div>
    </section>

    <!-- Right: Summary -->
    <section id="summary-panel">
      <div class="panel-header">Article Summary</div>
      <div id="summary-content">
        <div class="summary-placeholder">
          <div class="icon">📰</div>
          <span>Click <strong>Summarize</strong> on any article to see it here.</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2>API Keys</h2>
      <p>Your keys are stored only in your browser's localStorage and never sent anywhere except the respective APIs.</p>
      <div class="field">
        <label>NewsData.io API Key</label>
        <input type="password" id="newsdata-key-input" placeholder="Enter your NewsData.io API key" autocomplete="off">
      </div>
<div class="modal-actions">
        <button class="btn-primary" id="save-keys-btn">Save & Load News</button>
        <button class="btn-secondary" id="cancel-keys-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // ── State ──
    let newsdataKey = localStorage.getItem('newsdata_api_key') || '';
    let activeFilter = '';        // current filter text

    // Country keyword → newsdata.io country code
    const COUNTRY_MAP = {
      'us': 'us', 'usa': 'us', 'united states': 'us', 'american': 'us', 'america': 'us',
      'uk': 'gb', 'united kingdom': 'gb', 'british': 'gb', 'britain': 'gb', 'england': 'gb',
      'canada': 'ca', 'canadian': 'ca',
      'australia': 'au', 'australian': 'au',
      'india': 'in', 'indian': 'in',
      'germany': 'de', 'german': 'de',
      'france': 'fr', 'french': 'fr',
      'spain': 'es', 'spanish': 'es',
      'italy': 'it', 'italian': 'it',
      'brazil': 'br', 'brazilian': 'br',
      'japan': 'jp', 'japanese': 'jp',
    };

    function parseFilter(raw) {
      const text = raw.toLowerCase().trim();
      let country = null;
      let keyword = raw.trim();

      // Check each country alias against the filter text
      for (const [alias, code] of Object.entries(COUNTRY_MAP)) {
        if (text.includes(alias)) {
          country = code;
          // Strip the country word from the keyword query
          keyword = raw.replace(new RegExp(alias, 'i'), '').replace(/\s+/g, ' ').trim();
          break;
        }
      }

      // Strip generic words that aren't useful as keyword queries
      keyword = keyword.replace(/\bsports?\b/gi, '').replace(/\s+/g, ' ').trim();

      return { country, keyword };
    }

    // ── DOM refs ──
    const modalOverlay      = document.getElementById('modal-overlay');
    const newsdataKeyInput  = document.getElementById('newsdata-key-input');
    const saveKeysBtn       = document.getElementById('save-keys-btn');
    const cancelKeysBtn     = document.getElementById('cancel-keys-btn');
    const settingsBtn       = document.getElementById('settings-btn');
    const articlesContainer = document.getElementById('articles-container');
    const summaryContent    = document.getElementById('summary-content');
    const filterInput       = document.getElementById('filter-input');
    const filterBtn         = document.getElementById('filter-btn');
    const clearFilterBtn    = document.getElementById('clear-filter-btn');
    const filterTag         = document.getElementById('filter-tag');

    // ── Modal ──
    function openModal() {
      newsdataKeyInput.value = newsdataKey;
      modalOverlay.classList.remove('hidden');
    }

    function closeModal() {
      modalOverlay.classList.add('hidden');
    }

    settingsBtn.addEventListener('click', openModal);
    cancelKeysBtn.addEventListener('click', closeModal);

    // ── Filter ──
    function applyFilter() {
      const val = filterInput.value.trim();
      activeFilter = val;
      if (val) {
        filterTag.textContent = val;
        filterTag.style.display = 'inline';
        clearFilterBtn.style.display = 'inline';
      } else {
        filterTag.style.display = 'none';
        clearFilterBtn.style.display = 'none';
      }
      loadNews(val);
    }

    filterBtn.addEventListener('click', applyFilter);
    filterInput.addEventListener('keydown', e => { if (e.key === 'Enter') applyFilter(); });

    clearFilterBtn.addEventListener('click', () => {
      filterInput.value = '';
      activeFilter = '';
      filterTag.style.display = 'none';
      clearFilterBtn.style.display = 'none';
      loadNews();
    });

    saveKeysBtn.addEventListener('click', () => {
      newsdataKey = newsdataKeyInput.value.trim();
      if (newsdataKey) localStorage.setItem('newsdata_api_key', newsdataKey);
      closeModal();
      loadNews();
    });

    // ── News ──
    async function loadNews(filterText = '') {
      if (!newsdataKey) return;

      articlesContainer.innerHTML = '';
      const stateEl = document.createElement('div');
      stateEl.className = 'state-msg';
      stateEl.innerHTML = '<div class="spinner"></div><span>Loading sports news…</span>';
      articlesContainer.appendChild(stateEl);

      try {
        let url = `https://newsdata.io/api/1/news?apikey=${encodeURIComponent(newsdataKey)}&category=sports&language=en`;

        if (filterText) {
          const { country, keyword } = parseFilter(filterText);
          if (country) url += `&country=${country}`;
          if (keyword) url += `&q=${encodeURIComponent(keyword)}`;
        }
        const res = await fetch(url);
        if (!res.ok) throw new Error(`NewsData.io API error: ${res.status}`);
        const data = await res.json();
        if (data.status !== 'success') throw new Error(data.results?.message || 'NewsData.io request failed');

        const articles = (data.results || []).slice(0, 10);
        articlesContainer.innerHTML = '';

        if (articles.length === 0) {
          articlesContainer.innerHTML = '<div class="state-msg">No articles found.</div>';
          return;
        }

        articles.forEach(article => {
          const card = document.createElement('div');
          card.className = 'article-card';
          card.innerHTML = `
            <div class="article-title">${escapeHtml(article.title)}</div>
            <div style="display:flex;align-items:center;gap:0.75rem;margin-top:0.5rem">
              <a class="article-link" href="${escapeHtml(article.link)}" target="_blank" rel="noopener">Read more →</a>
              <button class="summarize-btn">Summarize</button>
            </div>
          `;
          card.querySelector('.summarize-btn').addEventListener('click', () => showSummary(article));
          articlesContainer.appendChild(card);
        });

      } catch (err) {
        articlesContainer.innerHTML = `
          <div class="state-msg">
            <span>⚠️ Could not load news.</span>
            <span style="font-size:0.8rem">${escapeHtml(err.message)}</span>
            <button class="btn-secondary" onclick="openModal()" style="margin-top:0.5rem">Check API Key</button>
          </div>`;
      }
    }

    // ── Summary ──
    function showSummary(article) {
      document.querySelectorAll('.article-card').forEach(c => c.style.borderColor = '');
      event.currentTarget.closest('.article-card').style.borderColor = 'var(--accent)';
      summaryContent.innerHTML = `
        ${article.source_id ? `<div class="summary-source">${escapeHtml(article.source_id)}</div>` : ''}
        <div class="summary-title">${escapeHtml(article.title)}</div>
        <hr class="summary-divider">
        <div class="summary-label">Summary</div>
        <div class="summary-body">${escapeHtml(article.description || 'No description available.')}</div>
        <div class="summary-footer">
          <a class="article-link" href="${escapeHtml(article.link)}" target="_blank" rel="noopener">Read full article →</a>
        </div>
      `;
    }

    // ── Utilities ──
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Init ──
    if (!newsdataKey) {
      modalOverlay.classList.remove('hidden');
      articlesContainer.innerHTML = `
        <div class="state-msg">
          <span>Enter your NewsData.io API key to get started.</span>
        </div>`;
    } else {
      modalOverlay.classList.add('hidden');
      loadNews();
    }
  </script>
</body>
</html>
